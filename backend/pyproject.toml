[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-meeting-interpreter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.35.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "rapidfuzz>=3.9.0",
    "python-dotenv>=1.0.1",
    "unicodedata2>=15.1.0",
    "google-genai>=0.8.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: fast, no network",
    "integration: in-process, mocked external APIs",
    "e2e: full stack via test client or browser",
    "live_api: hits real OpenAI/Soniox (excluded by default)",
    "live_llm_judge: hits real LLM judges (excluded by default)",
]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
