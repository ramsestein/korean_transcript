<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Real-time Korean transcription and translation for meetings" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <title>Korean Meeting Interpreter</title>
  </head>
  <body style="background: #0f0f1a; color: #e8e8f0; font-family: system-ui, sans-serif; margin: 0;">
    <div id="root">
      <!-- Fallback: shows if React fails to mount -->
      <div id="fallback" style="padding: 40px; text-align: center;">
        <h1>Korean Meeting Interpreter</h1>
        <p id="fallback-msg">Loading application...</p>
      </div>
    </div>
    <script>
      // Immediate debug - runs before React
      console.log('index.html: page loaded, waiting for React...');
      document.getElementById('fallback-msg').textContent = 'JavaScript is running, loading React...';
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
